<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>נקודת מבט | זירת העובדות והערכים</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Assistant', sans-serif; background-color: #f4f7f9; }
        .n12-red { color: #d71920; }
        .n12-bg-red { background-color: #d71920; }
        .category-tab { cursor: pointer; transition: all 0.3s; border-bottom: 3px solid transparent; }
        .category-tab:hover, .category-tab.active { border-bottom-color: #d71920; color: #d71920; }
        .news-card { transition: all 0.2s; cursor: pointer; }
        .news-card:hover { transform: translateY(-4px); box-shadow: 0 12px 20px -5px rgba(0, 0, 0, 0.1); }
        .perspective-container { display: none; }
        .view-active .perspective-container { display: block; }
        .view-active .main-feed { display: none; }
        .perspective-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
        @media (max-width: 768px) { .perspective-grid { grid-template-columns: 1fr; } }
        .section-label { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; color: #64748b; margin-bottom: 0.5rem; display: block; }
    </style>
</head>
<body class="text-gray-900">

    <header class="bg-white shadow-md sticky top-0 z-50 border-b border-gray-100">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-10">
                <div class="text-3xl font-black n12-red tracking-tighter cursor-pointer" onclick="filterCategory('ראשי')">נקודת<span class="text-slate-800">מבט</span></div>
                <nav id="main-nav" class="hidden lg:flex gap-6 font-bold text-sm text-gray-500">
                    <div class="category-tab active" onclick="filterCategory('ראשי')">ראשי</div>
                    <div class="category-tab" onclick="filterCategory('פוליטיקה')">פוליטיקה</div>
                    <div class="category-tab" onclick="filterCategory('ביטחון')">ביטחון</div>
                    <div class="category-tab" onclick="filterCategory('כלכלה')">כלכלה</div>
                    <div class="category-tab" onclick="filterCategory('חברה')">חברה</div>
                </nav>
            </div>
            <div class="text-xs font-bold text-slate-400 bg-slate-50 px-3 py-1 rounded-full border border-slate-100">זירת העובדות והערכים המקצועית</div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8">
        <!-- Main Feed -->
        <section class="main-feed">
            <h2 id="current-category-title" class="text-2xl font-black mb-8 border-r-4 border-red-600 pr-4">הכותרות הראשיות</h2>
            <div id="news-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                <!-- Content injected by JS -->
            </div>
        </section>

        <!-- Detailed Perspective View -->
        <section id="perspective-view" class="perspective-container">
            <button onclick="closePerspective()" class="mb-6 flex items-center gap-2 text-slate-400 font-bold hover:text-red-600 transition">
                <i class="fas fa-arrow-right"></i> חזרה לכל הכתבות
            </button>
            <div id="perspective-content">
                <!-- Detailed content injected by JS -->
            </div>
        </section>
    </main>

    <footer class="bg-white border-t border-gray-200 py-12 mt-20">
        <div class="container mx-auto px-4 text-center">
            <div class="text-2xl font-black n12-red mb-4">נקודת<span class="text-slate-800">מבט</span></div>
            <p class="text-gray-400 text-sm italic">שקיפות. עובדות. פרספקטיבה.</p>
        </div>
    </footer>

    <script>
        const apiKey = ""; 

        const newsItems = [
            {
                id: 'inquiry',
                category: "פוליטיקה",
                title: "ועדת חקירה למחדל ה-7 באוקטובר: ממלכתית או ממשלתית?",
                summary: "הקרב על סמכויות החקירה: מי ימנה את היו\"ר ומה תהיה מידת העצמאות של הגוף החוקר?",
                img: "https://images.unsplash.com/photo-1589829545856-d10d557cf95f?auto=format&fit=crop&w=800&q=80",
                sideA: {
                    value: "עצמאות שיפוטית",
                    label: "התומכים בוועדת חקירה ממלכתית",
                    facts: "מוקמת לפי חוק ועדות חקירה, תשכ\"ט-1968. היו\"ר ממונה ע\"י נשיא העליון. בעלת סמכויות כפייה של עדים וחיסיון מלא.",
                    logic: "רק ניתוק מוחלט מהדרג הפוליטי הנחקר יבטיח אמון ציבורי ויושרה מקצועית ללא פשרות.",
                    sources: "חוק ועדות חקירה, תשכ\"ט; תקדימי ועדת אגרנט וועדת כהן."
                },
                sideB: {
                    value: "ריבונות ממשלתית",
                    label: "התומכים בוועדת בדיקה ממשלתית",
                    facts: "מוקמת לפי סעיף 8א לחוק הממשלה, תשס\"א-2001. הממשלה קובעת את הסמכויות ואת הרכב הוועדה.",
                    logic: "הממשלה היא הריבון הנבחר. חקירה צריכה להתמקד בכשלים המקצועיים ולא לשמש ככלי להפלת שלטון בזמן מלחמה.",
                    sources: "חוק הממשלה, תשס\"א; דו\"ח ועדת וינוגרד."
                }
            },
            {
                id: 'economy',
                category: "כלכלה",
                title: "סבסוד מעונות היום: פגיעה בתוצר או שימור הסטטוס קוו?",
                summary: "הממשלה מקדמת חוק שיאפשר המשך סבסוד למשפחות שבהן האב אינו עובד. ההשלכות הכלכליות.",
                img: "https://images.unsplash.com/photo-1596464716127-f2a82984de30?auto=format&fit=crop&w=800&q=80",
                sideA: {
                    value: "תמרוץ תעסוקה",
                    label: "המתנגדים לסבסוד ללא-עובדים",
                    facts: "לפי בנק ישראל, היעדר תמרוץ יציאה לעבודה בקרב גברים חרדים פוגע בתוצר הלאומי במיליארדי שקלים בשנה.",
                    logic: "הקופה הציבורית צריכה לעודד יצרנות. סבסוד גורף למי שאינו תורם לכלכלה יוצר נטל בלתי נסבל על מעמד הביניים.",
                    sources: "דו\"ח בנק ישראל 2023; ניירות עמדה של פורום קהלת."
                },
                sideB: {
                    value: "שימור עולם התורה",
                    label: "התומכים בהמשך הסבסוד",
                    facts: "אלפי משפחות נשענות על הסבסוד כערוץ כלכלי יחיד. ביטולו יוביל לעוני מיידי של עשרות אלפי ילדים.",
                    logic: "ערך לימוד התורה הוא נדבך קיומי בזהות המדינה. אין לכפות שינוי אורח חיים דרך הרעבה כלכלית של ילדים.",
                    sources: "הסכמים קואליציוניים; נתוני המכון החרדי למחקרי מדיניות."
                }
            },
            {
                id: 'security',
                category: "ביטחון",
                title: "שב\"חים בערים: צורך כלכלי או מחדל ביטחוני?",
                summary: "סוגיית כניסת פועלים פלסטינים ללא היתר: המתח בין ענף הבנייה המשתק לבין ביטחון הפנים.",
                img: "https://images.unsplash.com/photo-1551135049-8a33b5883817?auto=format&fit=crop&w=800&q=80",
                sideA: {
                    value: "ביטחון קודם",
                    label: "הגישה הביטחונית המחמירה",
                    facts: "נתוני המשטרה מראים קשר ישיר בין נוכחות שב\"חים לעלייה בעבירות רכוש וסיכון לפח\"ע במרכזי הערים.",
                    logic: "ריבונות פירושה שליטה מלאה על הגבול. אסור להקריב את ביטחון האזרחים עבור נוחות של קבלנים.",
                    sources: "סקירות שב\"כ; חוק הכניסה לישראל."
                },
                sideB: {
                    value: "ניהול סיכונים",
                    label: "הגישה הכלכלית-ייצבית",
                    facts: "ענף הבנייה והתשתיות נמצא בקיפאון של 40%. מחסור בידיים עובדות מוביל לעלייה דראסטית במחירי הדיור.",
                    logic: "יש לאזן בין ביטחון לחיים. כניסה מבוקרת או העלמת עין חלקית הכרחית למניעת קריסה כלכלית.",
                    sources: "דו\"ח התאחדות הקבלנים; הערכות אגף התקציבים."
                }
            }
        ];

        let currentCategory = 'ראשי';

        function filterCategory(cat) {
            currentCategory = cat;
            closePerspective();
            document.querySelectorAll('.category-tab').forEach(tab => {
                tab.classList.toggle('active', tab.innerText === cat);
            });
            document.getElementById('current-category-title').innerText = cat === 'ראשי' ? 'הכותרות הראשיות' : `חדשות ${cat}`;
            renderGrid();
        }

        function renderGrid() {
            const grid = document.getElementById('news-grid');
            const filtered = currentCategory === 'ראשי' ? newsItems : newsItems.filter(i => i.category === currentCategory);
            
            grid.innerHTML = filtered.map(item => `
                <div onclick="openPerspective('${item.id}')" class="news-card bg-white rounded-2xl overflow-hidden border border-slate-200 flex flex-col h-full">
                    <img src="${item.img}" class="w-full h-48 object-cover">
                    <div class="p-6 flex flex-col flex-grow">
                        <span class="text-[10px] font-black text-red-600 mb-2 uppercase tracking-widest">${item.category}</span>
                        <h3 class="text-xl font-bold mb-3 text-slate-800 leading-tight">${item.title}</h3>
                        <p class="text-gray-500 text-sm mb-6 flex-grow">${item.summary}</p>
                        <div class="flex justify-between items-center pt-4 border-t border-slate-50">
                            <span class="text-red-600 font-bold text-xs">לניתוח המעמיק</span>
                            <i class="fas fa-chevron-left text-red-600 text-xs"></i>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function openPerspective(id) {
            const item = newsItems.find(i => i.id === id);
            const content = document.getElementById('perspective-content');
            
            content.innerHTML = `
                <div class="bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-100">
                    <div class="h-64 md:h-80 relative">
                        <img src="${item.img}" class="w-full h-full object-cover">
                        <div class="absolute inset-0 bg-slate-900/40"></div>
                        <div class="absolute bottom-0 right-0 p-10 text-white">
                            <h1 class="text-3xl md:text-5xl font-black mb-2">${item.title}</h1>
                            <p class="text-lg opacity-90">${item.summary}</p>
                        </div>
                    </div>
                    
                    <div class="p-8 md:p-12">
                        <div class="perspective-grid">
                            <!-- Side A -->
                            <div class="space-y-6">
                                <div class="bg-blue-600 text-white p-4 rounded-t-2xl text-center">
                                    <span class="text-xs font-bold uppercase opacity-80 block mb-1">ערך מוביל</span>
                                    <h2 class="text-2xl font-black">${item.sideA.value}</h2>
                                </div>
                                <div class="bg-blue-50/50 p-8 rounded-b-2xl border-x border-b border-blue-100 space-y-8">
                                    <div>
                                        <span class="section-label"><i class="fas fa-database ml-1"></i> עובדות ונתונים</span>
                                        <p class="text-slate-700 leading-relaxed font-semibold">${item.sideA.facts}</p>
                                    </div>
                                    <div>
                                        <span class="section-label"><i class="fas fa-comment-alt ml-1"></i> טיעונים וערכים</span>
                                        <p class="text-slate-600 leading-relaxed italic border-r-2 border-blue-200 pr-4">${item.sideA.logic}</p>
                                    </div>
                                    <div class="pt-4 border-t border-blue-100">
                                        <span class="section-label"><i class="fas fa-book ml-1"></i> מקורות להעמקה</span>
                                        <p class="text-xs text-blue-800 font-bold">${item.sideA.sources}</p>
                                    </div>
                                </div>
                            </div>

                            <!-- Side B -->
                            <div class="space-y-6">
                                <div class="bg-slate-800 text-white p-4 rounded-t-2xl text-center">
                                    <span class="text-xs font-bold uppercase opacity-80 block mb-1">ערך מוביל</span>
                                    <h2 class="text-2xl font-black">${item.sideB.value}</h2>
                                </div>
                                <div class="bg-slate-50 p-8 rounded-b-2xl border-x border-b border-slate-200 space-y-8">
                                    <div>
                                        <span class="section-label"><i class="fas fa-database ml-1"></i> עובדות ונתונים</span>
                                        <p class="text-slate-700 leading-relaxed font-semibold">${item.sideB.facts}</p>
                                    </div>
                                    <div>
                                        <span class="section-label"><i class="fas fa-comment-alt ml-1"></i> טיעונים וערכים</span>
                                        <p class="text-slate-600 leading-relaxed italic border-r-2 border-slate-300 pr-4">${item.sideB.logic}</p>
                                    </div>
                                    <div class="pt-4 border-t border-slate-200">
                                        <span class="section-label"><i class="fas fa-book ml-1"></i> מקורות להעמקה</span>
                                        <p class="text-xs text-slate-800 font-bold">${item.sideB.sources}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            document.body.classList.add('view-active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function closePerspective() {
            document.body.classList.remove('view-active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.onload = renderGrid;
    </script>
</body>
</html>
