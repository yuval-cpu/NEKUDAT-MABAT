<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>נקודת מבט | זירת העובדות והערכים</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Assistant', sans-serif; background-color: #f8f9fa; }
        .n12-red { color: #d71920; }
        .n12-bg-red { background-color: #d71920; }
        .category-tab { cursor: pointer; transition: all 0.3s; border-bottom: 3px solid transparent; }
        .category-tab:hover, .category-tab.active { border-bottom-color: #d71920; color: #d71920; }
        .news-card { transition: all 0.2s; cursor: pointer; }
        .news-card:hover { box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .perspective-container { display: none; }
        .view-active .perspective-container { display: block; }
        .view-active .main-feed { display: none; }
        .ai-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
        img { background-color: #e2e8f0; } /* Placeholder color while loading */
    </style>
</head>
<body class="text-gray-900">

    <header class="bg-white shadow-sm sticky top-0 z-50 border-b border-gray-200">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-8">
                <div class="text-3xl font-black n12-red tracking-tighter cursor-pointer" onclick="filterCategory('ראשי')">נקודת<span class="text-slate-800">מבט</span></div>
                <nav id="main-nav" class="hidden md:flex gap-6 font-bold text-sm text-gray-600">
                    <div class="category-tab active pb-1" onclick="filterCategory('ראשי')">ראשי</div>
                    <div class="category-tab pb-1" onclick="filterCategory('פוליטיקה')">פוליטיקה</div>
                    <div class="category-tab pb-1" onclick="filterCategory('ביטחון')">ביטחון</div>
                    <div class="category-tab pb-1" onclick="filterCategory('כלכלה')">כלכלה</div>
                </nav>
            </div>
            <div class="flex items-center gap-4 text-xs font-bold text-gray-400">
                זירת העובדות והערכים של ישראל
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8">
        <section class="main-feed">
            <h2 id="current-category-title" class="text-2xl font-black mb-8 border-r-8 border-red-600 pr-4 italic">הכותרות הראשיות</h2>
            <div id="news-grid" class="grid grid-cols-1 md:grid-cols-12 gap-6"></div>
        </section>

        <section id="perspective-view" class="perspective-container">
            <button onclick="closePerspective()" class="mb-8 flex items-center gap-2 text-slate-500 font-bold hover:text-red-600 transition">
                <i class="fas fa-chevron-right"></i> חזרה לכל הכתבות
            </button>
            <div id="perspective-content" class="bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100"></div>
        </section>
    </main>

    <footer class="bg-slate-900 text-white py-12 mt-20">
        <div class="container mx-auto px-4 text-center">
            <div class="text-3xl font-black n12-red tracking-tighter mb-6">נקודת<span class="text-white">מבט</span></div>
            <p class="text-gray-500 text-xs tracking-widest uppercase text-center">פרויקט ניתוח חדשות מבוסס בינה מלאכותית</p>
        </div>
    </footer>

    <script>
        const apiKey = ""; 

        const newsItems = [
            {
                id: 'inquiry',
                category: "פוליטיקה",
                title: "ועדת חקירה ממלכתית או ממשלתית? ההבדלים שחובה להכיר",
                summary: "ניתוח משפטי של מבנה הוועדות והסמכויות שיוענקו לחוקרים בעקבות אירועי השבעה באוקטובר.",
                img: "https://images.unsplash.com/photo-1450101499163-c8848c66ca85?auto=format&fit=crop&w=800&q=80",
                sideA: { 
                    title: "בעד ועדת חקירה ממלכתית", 
                    arguments: "רק גוף עצמאי לחלוטין, שבראשו עומד שופט הממונה על ידי נשיא העליון, יכול לחקור את הדרג המדיני ללא משוא פנים ולהחזיר את אמון הציבור במערכות השלטון." 
                },
                sideB: { 
                    title: "בעד ועדת בדיקה ממשלתית", 
                    arguments: "הממשלה היא הריבון הנבחר ועליה הסמכות לקבוע את גבולות החקירה. ועדת בדיקה מאפשרת לחקור את הכשלים המקצועיים מבלי להפוך את ההליך לכלי לניגוח פוליטי בזמן מלחמה." 
                }
            },
            {
                id: 'economy',
                category: "כלכלה",
                title: "משבר סבסוד המעונות: פגיעה ברווחה או עידוד יציאה לעבודה?",
                summary: "הממשלה דנה מחדש בקריטריונים לקבלת הנחות במעונות יום עבור הציבור החרדי.",
                img: "https://images.unsplash.com/photo-1596464716127-f2a82984de30?auto=format&fit=crop&w=800&q=80",
                sideA: { 
                    title: "גישת עידוד התעסוקה", 
                    arguments: "כספי המסים צריכים לתמרץ יצרנות. סבסוד למשפחות שבהן האב אינו עובד או לומד מקצוע יצרני פוגע בצמיחה הכלכלית של ישראל בטווח הארוך ומרחיב את הפערים." 
                },
                sideB: { 
                    title: "גישת הערך הקהילתי", 
                    arguments: "לימוד תורה הוא ערך קיומי לעם היהודי. פגיעה כלכלית אנושה בסבסוד למשפחות אלו תייצר קרע חברתי עמוק, תוביל לעוני קיצוני בקרב ילדים ולא תביא לשינוי המבוקש בכפייה." 
                }
            },
            {
                id: 'security',
                category: "ביטחון",
                title: "מגן אור: האם הלייזר הוא שובר השוויון הבא?",
                summary: "ישראל מאיצה את פיתוח מערכת היירוט מבוססת הלייזר. כל מה שצריך לדעת על הטכנולוגיה החדשה.",
                img: "https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?auto=format&fit=crop&w=800&q=80",
                sideA: { 
                    title: "יתרון אסטרטגי וכלכלי", 
                    arguments: "יירוט בלייזר עולה דולרים בודדים לעומת עשרות אלפי דולרים לטיל מיירט של כיפת ברזל. זהו שובר שוויון שיכול לנטרל את איום הטילים והכטב\"מים בצורה כלכלית." 
                },
                sideB: { 
                    title: "מגבלות מבצעיות", 
                    arguments: "מערכות לייזר אינן פועלות ביעילות בעננות, אובך או תנאי מזג אוויר קשים. הסתמכות יתר עליהן עלולה להשאיר את העורף חשוף ברגעים קריטיים שבהם המערכת פשוט לא תעבוד." 
                }
            }
        ];

        let currentCategory = 'ראשי';

        async function callGemini(prompt, systemPrompt = "") {
            const exponentialBackoff = async (fn, retries = 5, delay = 1000) => {
                try { return await fn(); }
                catch (e) {
                    if (retries <= 0) throw e;
                    await new Promise(resolve => setTimeout(resolve, delay));
                    return exponentialBackoff(fn, retries - 1, delay * 2);
                }
            };

            const fetchTask = async () => {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] }
                    })
                });
                if (!response.ok) throw new Error('API request failed');
                const result = await response.json();
                return result.candidates?.[0]?.content?.parts?.[0]?.text || "לא התקבלה תשובה מה-AI.";
            };

            try {
                return await exponentialBackoff(fetchTask);
            } catch (e) {
                return "שגיאה בחיבור לבינה המלאכותית.";
            }
        }

        async function generateAISummary(itemId) {
            const data = newsItems.find(i => i.id === itemId);
            const container = document.getElementById('ai-summary-container');
            container.innerHTML = `
                <div class="ai-pulse flex items-center justify-center gap-3 text-indigo-600 font-bold p-6 bg-indigo-50 rounded-xl border-2 border-dashed border-indigo-200">
                    <i class="fas fa-sparkles"></i>
                    <span>מנתח עובדות וטיעונים בזמן אמת...</span>
                </div>`;
            
            const prompt = `Analyze the controversy regarding: "${data.title}". Main arguments: "${data.sideA.arguments}" and "${data.sideB.arguments}". Provide a neutral, 3-4 sentence summary in Hebrew explaining the balance between them.`;
            const summary = await callGemini(prompt, "You are an objective news analyst. Summarize both sides neutrally without taking a stance.");
            
            container.innerHTML = `
                <div class="bg-indigo-600 text-white px-4 py-2 rounded-t-lg inline-block text-xs font-bold tracking-widest uppercase">סיכום בינה מלאכותית אובייקטיבי</div>
                <div class="bg-white border-2 border-indigo-100 p-6 rounded-b-lg rounded-l-lg text-slate-700 text-lg leading-relaxed shadow-lg">
                    ${summary}
                </div>
            `;
        }

        function filterCategory(cat) {
            currentCategory = cat;
            closePerspective();
            document.querySelectorAll('.category-tab').forEach(tab => {
                tab.classList.toggle('active', tab.innerText === cat);
            });
            document.getElementById('current-category-title').innerText = cat === 'ראשי' ? 'הכותרות הראשיות' : `חדשות ${cat}`;
            renderGrid();
        }

        function renderGrid() {
            const grid = document.getElementById('news-grid');
            const filtered = currentCategory === 'ראשי' ? newsItems : newsItems.filter(i => i.category === currentCategory);
            
            grid.innerHTML = filtered.map(item => `
                <div onclick="openPerspective('${item.id}')" class="news-card bg-white rounded-xl overflow-hidden shadow-sm border border-gray-100 md:col-span-4 flex flex-col h-full group">
                    <div class="relative overflow-hidden bg-gray-200">
                        <img src="${item.img}" 
                             onerror="this.src='https://images.unsplash.com/photo-1504711434969-e33886168f5c?auto=format&fit=crop&w=800&q=80'" 
                             class="w-full h-48 object-cover group-hover:scale-110 transition-transform duration-700">
                        <div class="absolute top-3 right-3">
                            <span class="n12-bg-red text-white text-[10px] px-2 py-1 rounded font-black uppercase tracking-wider">${item.category}</span>
                        </div>
                    </div>
                    <div class="p-6 flex-grow flex flex-col">
                        <h3 class="text-xl font-extrabold mb-3 leading-tight group-hover:text-red-600 transition-colors">${item.title}</h3>
                        <p class="text-gray-500 text-sm line-clamp-2">${item.summary}</p>
                        <div class="mt-6 pt-4 border-t border-gray-50 flex justify-between items-center text-slate-400 font-bold text-xs uppercase">
                            <span>קרא פרספקטיבה</span>
                            <i class="fas fa-chevron-left text-red-600"></i>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function openPerspective(id) {
            const data = newsItems.find(i => i.id === id);
            const content = document.getElementById('perspective-content');
            
            content.innerHTML = `
                <div class="relative h-72 md:h-[400px] bg-slate-800">
                    <img src="${data.img}" 
                         onerror="this.src='https://images.unsplash.com/photo-1504711434969-e33886168f5c?auto=format&fit=crop&w=800&q=80'"
                         class="w-full h-full object-cover opacity-80">
                    <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-slate-900/20 to-transparent"></div>
                    <div class="absolute bottom-0 right-0 p-8 md:p-12 text-white w-full">
                        <span class="bg-red-600 px-3 py-1 rounded text-xs font-black uppercase mb-4 inline-block">${data.category}</span>
                        <h1 class="text-3xl md:text-5xl font-black max-w-4xl">${data.title}</h1>
                    </div>
                </div>
                
                <div class="p-6 md:p-12">
                    <div class="flex flex-col md:flex-row justify-between items-start gap-8 mb-12">
                        <p class="text-xl text-slate-600 leading-relaxed max-w-2xl border-r-4 border-red-100 pr-6">${data.summary}</p>
                        <button onclick="generateAISummary('${data.id}')" class="w-full md:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-8 rounded-xl shadow-xl transition-all transform hover:-translate-y-1 flex items-center justify-center gap-3">
                            <i class="fas fa-wand-magic-sparkles"></i> 
                            <span>ניתוח AI אובייקטיבי</span>
                        </button>
                    </div>

                    <div id="ai-summary-container" class="mb-16"></div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div class="bg-blue-50/50 p-8 rounded-3xl border border-blue-100 relative overflow-hidden">
                            <div class="relative">
                                <div class="flex items-center gap-3 mb-6">
                                    <div class="w-10 h-10 bg-blue-600 text-white rounded-full flex items-center justify-center shadow-lg">
                                        <i class="fas fa-balance-scale"></i>
                                    </div>
                                    <h3 class="text-2xl font-black text-blue-900">${data.sideA.title}</h3>
                                </div>
                                <p class="text-slate-700 text-lg leading-relaxed">${data.sideA.arguments}</p>
                            </div>
                        </div>

                        <div class="bg-emerald-50/50 p-8 rounded-3xl border border-emerald-100 relative overflow-hidden">
                            <div class="relative">
                                <div class="flex items-center gap-3 mb-6">
                                    <div class="w-10 h-10 bg-emerald-600 text-white rounded-full flex items-center justify-center shadow-lg">
                                        <i class="fas fa-scale-balanced"></i>
                                    </div>
                                    <h3 class="text-2xl font-black text-emerald-900">${data.sideB.title}</h3>
                                </div>
                                <p class="text-slate-700 text-lg leading-relaxed">${data.sideB.arguments}</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            document.body.classList.add('view-active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function closePerspective() {
            document.body.classList.remove('view-active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.onload = renderGrid;
    </script>
</body>
</html>
